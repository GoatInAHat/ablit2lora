[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ablit2lora"
version = "0.3.1"
description = "Convert abliterated checkpoints to PEFT adapters and emit native multi-adapter vLLM/SGLang serving recipes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bennett Vernon" }]
keywords = ["abliteration", "abliterated", "lora", "peft", "converter", "vllm", "glm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.1,<3",
    "transformers>=4.45,<5",
    "safetensors>=0.4.3",
    "huggingface_hub>=0.23",
    "peft>=0.13,<1",
]

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["ruff>=0.6", "pytest>=8"]

[project.urls]
Homepage = "https://github.com/GoatInAHat/ablit2lora"
Repository = "https://github.com/GoatInAHat/ablit2lora"

[project.scripts]
ablit2lora = "ablit2lora.cli:main"

# EXPERIMENTAL, UNVERIFIED -- see src/ablit2lora/vllm_plugins/glm5next_lora.py.
# Loaded by vLLM's own plugin discovery inside a process that has vLLM
# installed; ablit2lora itself never imports this at runtime.
[project.entry-points."vllm.general_plugins"]
ablit2lora_glm5next_lora = "ablit2lora.vllm_plugins.glm5next_lora:register"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
